name: ci

on:
  push:
    branches: [main]
  pull_request:

# The repository ships the application *and* its test suite: tests/, fixtures/,
# docs/ and the AF3 validation tooling are version-controlled (see .gitignore,
# which records what is deliberately excluded, and why).
#
# That distinction is not academic. An earlier revision of this file ran only
# install + compile + import + a pipeline smoke on 3.9 and never executed the
# suite. In that state the package passed CI on 3.9 while seven helpers in
# configbuilder/variants/edits.py raised
# "TypeError: 'staticmethod' object is not callable" on the very same
# interpreter -- 30 tests failed locally that CI could not see. The `test` job
# below exists so a version claim is backed by an actual run.
jobs:
  test:
    name: suite (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.9 is the declared floor (requires-python = ">=3.9"); 3.11 is the
        # development version. 3.12 extends coverage one release upward, on
        # Linux only, to keep the matrix small.
        python-version: ["3.9", "3.11"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert the requested interpreter
        run: python -c "import sys; print(sys.version); assert sys.version_info[:2] == tuple(map(int, '${{ matrix.python-version }}'.split('.'))), sys.version"
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # -o addopts="" clears the project's `addopts = "-q"` so the summary line
      # is printed. The exit status is identical either way.
      - name: Full test suite
        run: python -m pytest -o addopts="" -q

  smoke:
    # Kept from the previous revision: proves the *installed* package (not the
    # source tree) imports, compiles, starts both entry points without a TTY and
    # builds one AF3 JSON end to end.
    name: smoke (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert baseline interpreter
        run: python -c "import sys; assert sys.version_info[:2] == (3, 9), sys.version"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Every shipped module compiles
        run: python -m compileall -q configbuilder
      - name: Package imports
        run: python -c "import configbuilder, configbuilder.app.cli"
      - name: Both entry points start and end cleanly on EOF (no TTY)
        # stdin is detached explicitly, so this is the same check on bash and
        # PowerShell (the Windows default shell has no `< /dev/null`).
        run: |
          python -c "import subprocess, sys; raise SystemExit(subprocess.call([sys.executable, '-m', 'configbuilder'], stdin=subprocess.DEVNULL))"
          python -c "import subprocess, sys; raise SystemExit(subprocess.call(['configbuilder'], stdin=subprocess.DEVNULL))"
      - name: Pipeline smoke - build and write one AF3 JSON
        shell: python
        run: |
          import json, os, pathlib, tempfile
          os.chdir(tempfile.mkdtemp())
          from configbuilder.ui.services import build_services

          services = build_services()
          services.projects.new("ci-smoke")
          assert services.configuration.add_record("protein", "ACDEFGHIKLMNPQRSTVWY").ok
          plan = services.generation.plan_base("out")
          assert plan.ok, getattr(plan, "message", "")
          result = services.generation.execute(plan)
          assert result.ok, getattr(result, "message", "")

          files = sorted(pathlib.Path("out").rglob("*.json"))
          assert files, "no JSON was written"
          document = json.loads(files[0].read_text(encoding="utf-8"))
          assert document["name"] == "ci-smoke", document["name"]
          assert document["modelSeeds"], "no model seeds"
          assert document["sequences"], "no entities"
          print("wrote", files[0])

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install ruff
      # The shipped source predates `ruff`'s default rule set (it produces
      # hundreds of pre-existing findings), so the gate is the correctness
      # subset: unused/undefined names, syntax errors, ambiguous names.
      #
      # Scope is `configbuilder` only, deliberately: the same subset over
      # `tests/` reports about 60 pre-existing findings (unused imports in
      # helpers), which is test hygiene rather than shipped-code correctness.
      # Widening it is a separate, reviewable change.
      - run: ruff check --select E4,E7,E9,F configbuilder
