name: ci

on:
  push:
    branches: [main]
  pull_request:

# The repository ships the application source only (no tests, no docs): the
# suite under tests/ is local development material (.gitignore). CI therefore
# verifies what it *can* see: the package installs, imports, compiles on the
# Python 3.9 baseline, both entry points start and end cleanly without a TTY,
# and the full build pipeline runs end to end to a written AF3 JSON file.
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert baseline interpreter
        run: python -c "import sys; assert sys.version_info[:2] == (3, 9), sys.version"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Every shipped module compiles
        run: python -m compileall -q configbuilder
      - name: Package imports
        run: python -c "import configbuilder, configbuilder.app.cli"
      - name: Both entry points start and end cleanly on EOF (no TTY)
        # stdin is detached explicitly, so this is the same check on bash and
        # PowerShell (the Windows default shell has no `< /dev/null`).
        run: |
          python -c "import subprocess, sys; raise SystemExit(subprocess.call([sys.executable, '-m', 'configbuilder'], stdin=subprocess.DEVNULL))"
          python -c "import subprocess, sys; raise SystemExit(subprocess.call(['configbuilder'], stdin=subprocess.DEVNULL))"
      - name: Pipeline smoke — build and write one AF3 JSON
        shell: python
        run: |
          import json, os, pathlib, tempfile
          os.chdir(tempfile.mkdtemp())
          from configbuilder.ui.services import build_services

          services = build_services()
          services.projects.new("ci-smoke")
          assert services.configuration.add_record("protein", "ACDEFGHIKLMNPQRSTVWY").ok
          plan = services.generation.plan_base("out")
          assert plan.ok, getattr(plan, "message", "")
          result = services.generation.execute(plan)
          assert result.ok, getattr(result, "message", "")

          files = sorted(pathlib.Path("out").rglob("*.json"))
          assert files, "no JSON was written"
          document = json.loads(files[0].read_text(encoding="utf-8"))
          assert document["name"] == "ci-smoke", document["name"]
          assert document["modelSeeds"], "no model seeds"
          assert document["sequences"], "no entities"
          print("wrote", files[0])

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install ruff
      # The shipped source predates `ruff`'s default rule set (it produces
      # hundreds of pre-existing findings), so the gate is the correctness
      # subset: unused/undefined names, syntax errors, ambiguous names.
      - run: ruff check --select E4,E7,E9,F configbuilder
