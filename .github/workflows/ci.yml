name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # IMPLEMENTATION_PLAN.md §4 / §21 Phase 0: the suite must run on the
        # 3.9.18 baseline on both authoring (Windows) and execution (Linux)
        # platforms. "3.9" resolves to the newest 3.9.x available on the
        # runner, which satisfies the 3.9.18 requirement; tests/architecture
        # additionally enforces the absence of 3.10-only constructs.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Confirm the interpreter is really 3.9.x (Phase 0 exit criterion).
      - name: Assert baseline interpreter
        run: python -c "import sys; assert sys.version_info[:2] == (3, 9), sys.version"
      - name: Install test dependencies only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest

  # §21 Phase 0: "CI running lint plus tests". Ruff needs no config for the
  # basics; it is a dev convenience here, not a runtime dependency.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install ruff
      - run: ruff check configbuilder tests
