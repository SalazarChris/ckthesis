name: ci

on:
  push:
    branches: [main]
  pull_request:

# The repository ships the application source only (no tests, no docs):
# CI verifies the package installs and launches on the Python 3.9 baseline
# on both authoring (Windows) and execution (Linux) platforms.
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert baseline interpreter
        run: python -c "import sys; assert sys.version_info[:2] == (3, 9), sys.version"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Console entry point resolves and exits cleanly on EOF
        run: configbuilder < /dev/null
      - name: Package imports
        run: python -c "import configbuilder, configbuilder.app.cli"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install ruff
      - run: ruff check configbuilder
