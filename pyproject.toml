[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "configbuilder"
version = "0.1.0"
description = "Terminal builder that produces validated, reproducible standalone AF3 input files"
requires-python = ">=3.9"
# IMPLEMENTATION_PLAN.md §4: the core builder runs on the standard library
# alone. Optional components sit behind a port with a documented fallback
# (§9.6), so absence removes convenience or validation strength, never
# capability. Nothing may move into [project].dependencies without amending
# the plan.
dependencies = []

[project.optional-dependencies]
# Development-only; not required to run the application (§4).
# Restored by the gate-recovery change: commit 85a606a dropped this extra while
# removing the gates, but .github/workflows/ci.yml still installs
# `-e ".[dev]"` and runs the suite, so a fresh clone needs pytest from here.
dev = [
    "pytest>=7",
    "hypothesis>=6",
]
# The SOP §6 comparative-analysis stack for af3_analysis (the builder above
# still needs nothing). numpy and pandas are hard requirements; the rest are
# used when present and fall back to documented internal implementations when
# not, so this extra is the full recommended set, not a minimum.
analysis = [
    "numpy>=1.21",
    "pandas>=1.3",
    "biopython>=1.79",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "PyYAML>=5.4",
    "freesasa>=2.1",
]
# Structural-template checking, strengthened (plan §9.6). The builder checks
# an attached template's mmCIF with its own lexical scan in every environment;
# with gemmi present the same file is *also* parsed by an established mmCIF
# library, which can only add strictness. Neither the core package nor [dev]
# needs it, and its absence removes strength, never capability.
templates = [
    "gemmi>=0.6",
]
# The optional desktop front end (Stage 1: review & preview). It is deliberately
# NOT installed with the core package or with ``[dev]``, so CI's 3.9 job and
# ``pip install .`` on 3.9 still need nothing. The floor below still admits 3.9:
# there the range resolves to PySide6 6.10.3, while 6.11 and later require 3.10+
# (which is what yields the current 6.12). Prefer a 3.10+ interpreter -- it is the
# verified combination, and 6.11.2 is the first PySide6 the GUI suite is green
# on:  pip install -e ".[gui]"
gui = [
    "PySide6>=6.6",
]

[project.scripts]
configbuilder = "configbuilder.app.cli:main"

# The desktop front end is a separate launcher, so the console entry point
# above keeps working exactly as before. It is a ``gui-scripts`` entry so a
# future Windows packaging step can suppress a console window; today it
# behaves like any console script. PySide6 (the ``gui`` extra) must be
# installed first; a 3.10-or-newer interpreter is recommended for it (see the
# ``gui`` extra's note above for the 3.9 case).
[project.gui-scripts]
af3-json-builder = "configbuilder.ui.render.qt.application:main"

[tool.setuptools.packages.find]
include = ["configbuilder*", "af3_analysis*"]

# Restored with the dev extra: 85a606a removed this table too, leaving the CI
# workflow's `-o addopts=""` override referring to an option that no longer
# existed and a plain `pytest` invocation without a test path.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
